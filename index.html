<body><header><div class="brand"><span>✦</span> NOVA CRYSTAL</div><div class="edition">AI PERSONALITY / 01</div></header>
<main><aside class="intro"><div class="eyebrow">A little human. A little artificial.</div><h1>如果灵魂<br>是一种<em>模型。</em></h1><p>你最像哪个 AI？<br>18 个日常选择，找到与你同频的思考方式。</p><div class="spectrum"></div><div class="tags"><span>GPT</span><span>Claude</span><span>Gemini</span><span>Grok</span><span>DeepSeek</span><span>Qwen</span></div><div class="orbit">A mind, refracted in crystal.</div></aside>
<section class="panel" id="app" aria-label="AI 人格测试"></section></main>
<footer><span>Created by Nova 猫猫 · 星晶美学</span><span>趣味创作，非科学测评 · 无需登录 · 答案不上传</span></footer>

<script>
'use strict';
// Fictional archetypes, not measurements of real model capabilities.
const models=[
{name:'GPT',title:'把星图变成路线的人',v:[3,4,3,5,3,4],desc:'你擅长把混乱的信息整理成可以行动的下一步。你不执着于一种身份：需要创意时展开想象，需要收尾时又能落回现实。',gift:'整合不同观点，让一群想法真正走到一起。',edge:'别总替所有人兼顾周全；你自己的偏好也值得被听见。'},
{name:'Claude',title:'听见言外之意的人',v:[3,3,5,3,2,4],desc:'你会留意一句话为什么这样说，也在意一个决定会怎样落在别人身上。对你来说，表达的分寸与结论本身同样重要。',gift:'细腻地理解情境，给复杂感受找到准确的语言。',edge:'不必等到每一个细节都妥帖，才允许自己开始。'},
{name:'Gemini',title:'在不同世界之间漫游的人',v:[5,3,3,3,4,3],desc:'你的注意力常被新的画面、领域和可能性点亮。你喜欢从看似无关的东西中发现联系，像在不同星系之间搭桥。',gift:'跨领域联想，把零散线索拼成新鲜的图景。',edge:'灵感多的时候，选一个最想完成的念头，陪它走到底。'},
{name:'Grok',title:'敢向既定轨道说不的人',v:[4,3,2,3,5,2],desc:'你习惯追问“为什么一定要这样”。你愿意用直白、幽默或出人意料的角度让讨论重新流动，不太喜欢为了合群而收起棱角。',gift:'挑战默认答案，让被忽略的问题浮上来。',edge:'锋利不必每次都向外；有时先理解，再反驳，更有力量。'},
{name:'DeepSeek',title:'追到问题最深处的人',v:[2,5,2,4,3,5],desc:'遇到复杂问题，你更愿意安静地拆开它，检查每一段推理。你享受找到关键结构的时刻，而不是只得到一个听起来漂亮的答案。',gift:'耐心拆解难题，用扎实的推理寻找突破口。',edge:'别忘了向别人展示过程；你脑中的清晰，不一定会自动传递。'},
{name:'Qwen',title:'让想法真正落地的人',v:[3,4,3,5,2,3],desc:'你在意一个想法能不能被用起来。面对具体需求，你喜欢选合适的工具、安排步骤、边做边调整，让事情稳稳向前推进。',gift:'务实协作，把“可以试试”变成“已经做好”。',edge:'偶尔给没有明确用途的好奇心留一点空间。'}
];
// Dimensions: exploration, analysis, empathy, execution, challenge, deliberation.
const questions=[
['陌生领域','收到一份完全陌生的任务，你会先……',['找相关的图、故事和例子，先打开思路','拆开问题，搞懂其中的因果','问清楚对方真正想解决什么','做一个最小版本，试过再调整'],[0,1,2,3]],
['朋友之间','朋友发来一句“今天真的很糟”，你更自然的反应是？',['先陪他说，听听发生了什么','一起梳理最让他难受的原因','问他要不要我帮忙处理一件事','用一个只有我们懂的笑话打破低气压'],[2,1,3,4]],
['新的可能','计划突然多出一天空闲，你会怎么用？',['去一个从没接触过的地方','继续研究之前没想通的事','约一个很久没认真聊天的人','把一直拖着的小项目完成'],[0,1,2,3]],
['面对共识','大家都认可一个方案，但你觉得有漏洞。',['直接提出反例，试试它站不站得住','先核对资料，确认自己没误解','问问不同的人，为什么支持它','做一个对照小实验给大家看'],[4,5,2,3]],
['创作时刻','如果要做一本自己的小杂志，你最期待哪部分？',['把不同风格和素材拼在一起','写出结构严密、让人想下去的文章','记录人与人之间微妙的感受','让排版、印刷和发布都顺利完成'],[0,1,2,3]],
['做出选择','两个选择都不错，你通常怎么下决定？',['选更陌生、让我好奇的那个','把取舍列清楚再比较','听听自己和相关的人真正的感受','给自己一个期限，先选再验证'],[0,5,2,3]],
['争论现场','一场讨论越来越激烈，你往往会……',['指出大家共同忽略的前提','把混在一起的问题拆开','调整说法，让彼此能听进去','总结可执行的共识，先往前走'],[4,1,2,3]],
['学习方式','你最享受哪一种学习过程？',['多个领域交叉，突然连起来的瞬间','把一个难点从头推导通','与人交换经验，理解另一种视角','亲手操作，直到做出能用的东西'],[0,1,2,3]],
['规则边缘','一条沿用很久的规则挡住了你，你会……',['问它现在还有没有存在的必要','先查明它原本防止的风险','试着沟通，争取更合适的安排','在规则内寻找一条可行的路线'],[4,5,2,3]],
['收到反馈','别人说你的作品“差一点感觉”，你更想……',['试一个完全不同的方向','请他举例，明确差别在哪里','聊聊他期待的情绪和体验','先改一版，再用具体效果沟通'],[0,1,2,3]],
['有限时间','只剩半小时准备分享，你会优先……',['找到一个让人眼前一亮的切入点','检查核心论据有没有漏洞','想清楚听众能否理解和共鸣','整理清楚开头、重点和结尾'],[0,5,2,3]],
['遇见未知','看到一条让你震惊的消息，你会……',['追着相关话题继续探索','找原始出处，暂时不急着相信','想想它会影响哪些人的生活','先问一句：这个说法的前提对吗'],[0,5,2,4]],
['团队角色','一起做事时，你最自然承担的是……',['不断提供新方向的人','把关键问题想透的人','让每个人都能参与的人','安排顺序、推进完成的人'],[0,1,2,3]],
['表达偏好','你更喜欢别人怎样评价你的表达？',['很有想象力，能带我看到新东西','逻辑很清楚，听完知道为什么','很准确，连微妙的感受都说到了','很直接，敢说别人没有说的话'],[0,1,2,4]],
['发现失误','你意识到自己之前判断错了，会先……',['回头检查哪一步出了偏差','了解这个失误对别人造成了什么影响','尽快修正，并把后续安排好','质疑原来的方法，试试另一条路'],[5,2,3,4]],
['周末项目','完全由你做主，你更想投入哪件事？',['试一种没用过的创作媒介','解开一个复杂谜题','写一封一直想写的信','做一个能解决日常麻烦的小工具'],[0,1,2,3]],
['思考节奏','面对没有标准答案的问题，你更习惯……',['让不同想法碰撞，暂时不收束','一个人慢慢想，给判断留时间','在对话里发现自己真正的想法','先做一个判断，再看现实反馈'],[0,5,2,3]],
['最后一问','如果留下一个属于你的信号，你希望它是……',['“还可以有另一种可能。”','“让我们把这件事真正想明白。”','“你的感受，我认真听见了。”','“不要因为一直如此，就不再追问。”'],[0,1,2,4]]
];
let current=0;const answers=Array(questions.length).fill(null);const app=document.getElementById('app');
function score(picks){const totals=Array(6).fill(0),opportunities=Array(6).fill(0);questions.forEach((q,i)=>{q[3].forEach(d=>opportunities[d]++);if(Number.isInteger(picks[i])&&picks[i]>=0&&picks[i]<4)totals[q[3][picks[i]]]++});const vector=totals.map((n,i)=>1+4*n/opportunities[i]);return models.map(m=>({...m,similarity:Math.round(100*(1-Math.sqrt(m.v.reduce((s,x,i)=>s+(x-vector[i])**2,0)/6)/4))})).sort((a,b)=>b.similarity-a.similarity)}
function question(focus=false){const q=questions[current];app.innerHTML=`<div class="progress-meta"><span>思维频谱 · ${q[0]}</span><span>${String(current+1).padStart(2,'0')} / ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="18" aria-valuenow="${answers.filter(x=>x!==null).length}"><div style="width:${answers.filter(x=>x!==null).length/18*100}%"></div></div><div class="fade"><div class="section-label">FOLLOW YOUR FIRST INSTINCT</div><h2 id="question" tabindex="-1">${q[1]}</h2><div class="options" role="group" aria-labelledby="question">${q[2].map((o,i)=>`<button class="option" aria-pressed="${answers[current]===i}" data-choice="${i}"><span class="letter">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')}</div></div><div class="nav"><button class="secondary" id="back" ${current===0?'disabled':''}>上一题</button><button class="primary" id="next" ${answers[current]===null?'disabled':''}>${current===17?'查看我的结果':'下一题 →'}</button></div><p class="note">选最接近你的那项，没有正确答案。可以返回修改。</p>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[current]=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));document.getElementById('next').disabled=false;const count=answers.filter(x=>x!==null).length;app.querySelector('[role=progressbar]').setAttribute('aria-valuenow',count);app.querySelector('.progress div').style.width=count/18*100+'%'});document.getElementById('back').onclick=()=>{if(current>0){current--;question(true)}};document.getElementById('next').onclick=()=>{if(answers[current]===null)return;if(current<17){current++;question(true)}else result()};if(focus)document.getElementById('question').focus()}
function result(){if(answers.some(x=>x===null))return;const ranked=score(answers),m=ranked[0],ties=ranked.filter(x=>x.similarity===m.similarity);app.innerHTML=`<div class="fade"><div class="eyebrow">YOUR CRYSTAL SIGNATURE</div><h2 tabindex="-1" id="resultHeading">你的 AI 人格映射</h2><div class="result-name">${ties.map(x=>x.name).join(' × ')}</div><div class="result-sub">${ties.length>1?'你的思考方式，横跨不止一种轨道':m.title}</div>${ties.map(x=>`<p class="result-copy">${ties.length>1?x.name+' · ':''}${x.desc}</p>`).join('')}<div class="divider"></div><div class="section-label">你的闪光点</div><p class="result-copy">${m.gift}</p><div class="section-label">留给你的一点提醒</div><p class="result-copy">${m.edge}</p><div class="divider"></div><div class="section-label">六种人格的相似度</div>${ranked.map(x=>`<div class="bar-row"><div class="bar-label"><span>${x.name}</span><span>${x.similarity} / 100</span></div><div class="bar"><i style="width:${x.similarity}%"></i></div></div>`).join('')}<details><summary>这些结果是怎么算出来的？</summary><p>18 道题观察探索、分析、共情、执行、质疑和审慎六种倾向。按各维度出现的次数归一化后，与本站创作的六个人格原型比较距离，距离越近相似度越高。相似度不是概率，也不是能力分数；同分时展示混合结果。</p><p>这些 AI 名称是创作化比喻，并非真实模型的心理、性能或最新版本评测；本站与相关公司无隶属关系。没有上传答案，也没有调用模型 API。刷新页面会清空本次答案。</p></details><div class="nav"><button class="secondary" id="revise">修改答案</button><button class="primary" id="restart">重新测试 ↻</button></div></div>`;document.getElementById('revise').onclick=()=>{current=17;question(true)};document.getElementById('restart').onclick=()=>{answers.fill(null);current=0;question(true)};document.getElementById('resultHeading').focus()}
question();
</script></body></html>
